  {id:'u_georgieva', email:'s.georgieva@meta8.bg',     password:'Georg@24',   name:'С. Георгиева', role:'user', confirmed:true, company:['meta8'],                    meta8Prods:['метални'], manager:true, createdAt:'2024-01-01T00:00:00Z'},
  {id:'u_ganchev',   email:'arh_ganchev@meta8.bg',    password:'Ganch@2025', name:'Арх. Ганчев',  role:'admin', confirmed:true, company:'all', meta8Prods:[], createdAt:'2025-01-01T00:00:00Z'},
  {id:'u_petrov',    email:'p.petrov@meta8.bg',        password:'Petr@2025',  name:'П. Петров',    role:'admin', confirmed:true, company:'all', meta8Prods:[], createdAt:'2025-01-01T00:00:00Z'},
];

// IDs of the erroneously-seeded duplicate productions — remove them on next startup
const _CLEANUP_PROD_IDS = ['p_armatura','p_mrezi','p_prof_suho','p_usilv','p_lamarina','p_gvozdei','p_fibri','p_tel','p_uslugi','p_met_konstr'];

// ================== DEFAULT DATA ==================
function defaultDB() {
  return {
    users: [{
      id:'u_admin', email:'admin@meta8.bg', password:'FinancePro_2026',
      role:'admin', name:'Администратор', confirmed:true, company:'all',
      createdAt:'2024-01-01T00:00:00Z'
    }],
    meta8: {
      productions:[{id:'p1', name:'Основно производство', createdAt:'2024-01-01T00:00:00Z'}],
      entries:[]
    },
    liderStroy: {
      objects:[{id:'lo1', name:'Обект 1', budget:500000, subObjects:[]}],
      entries:[]
    },
    bso: {
      subcategories:[
        {id:'b1',name:'Индустриален парк',budget:0,subObjects:[]},
        {id:'b2',name:'Църква Свищов',budget:0,subObjects:[]},
        {id:'b3',name:'Парк Калето',budget:0,subObjects:[]},

        {id:'b8',name:'Бяла Сметище',budget:0,subObjects:[]},
        {id:'b9',name:'Плевен Блок за Саниране #1',budget:0,subObjects:[]},
        {id:'b10',name:'Блок за Саниране #2',budget:0,subObjects:[]}
      ],
      entries:[]
    },
    metaPlan:{ entries:[] },
    kasaVarna:{ entries:[] },
    kasaPavlikeni:{ entries:[] },
    investments:{
      objects:[
        {id:'i1',name:'Радиозавод',subObjects:[]},
        {id:'i2',name:'Администрация на радиозавод',subObjects:[]},
        {id:'i3',name:'Магазини',subObjects:[]},
        {id:'i4',name:'Офис над магазини',subObjects:[]},
        {id:'i5',name:'Автомивка',subObjects:[]},
        {id:'i6',name:'Спортни съоражения',subObjects:[]}
      ],
      entries:[]
    },
    bsoDzzd: {
      objects: [],
      entries: []
    },
    resetTokens:[]
  };
}

// ================== DB & SESSION ==================
// Start with localStorage cache immediately (instant UI), then sync from Firebase
let db = (()=>{
  try{
    const s=localStorage.getItem(DB_KEY);
    if(!s) return defaultDB();
    const parsed = JSON.parse(s);
    // _fixArrays called after it's defined below — patched via initDB on first run
    return parsed;
  }catch(e){ return defaultDB(); }
})();
let session = (()=>{ try{ const s=localStorage.getItem(SES_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }})();

let _fbEvtSrc      = null;   // SSE EventSource for real-time sync
let _fbOnline      = false;  // is Firebase reachable?
let _ownSaveTs     = 0;      // timestamp of our last save (to suppress echo)
let _fbFirstEvent  = true;   // skip the initial full-db SSE event (already loaded via initDB)
let _pendingRender = false;  // SSE update arrived while modal was open — re-render on close

// ---- Firebase Auth token state ----
let _fbToken        = null;  // current ID token
let _fbRefreshTok   = null;  // refresh token (long-lived)
let _fbTokenExpiry  = 0;     // ms timestamp when token expires

async function _fbSignIn(){
  const res = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_API_KEY}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:FB_AUTH_EMAIL, password:FB_AUTH_PASS, returnSecureToken:true}) }
  );
  if(!res.ok) throw new Error('Firebase sign-in failed: '+res.status);
  const d = await res.json();
  _fbToken       = d.idToken;
  _fbRefreshTok  = d.refreshToken;
  _fbTokenExpiry = Date.now() + (parseInt(d.expiresIn,10) - 60) * 1000; // refresh 1 min early
  return _fbToken;
}

async function _fbRefresh(){
  const res = await fetch(
    `https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({grant_type:'refresh_token', refresh_token:_fbRefreshTok}) }
  );
  if(!res.ok) throw new Error('Token refresh failed: '+res.status);
  const d = await res.json();
  _fbToken       = d.id_token;
  _fbRefreshTok  = d.refresh_token;
  _fbTokenExpiry = Date.now() + (parseInt(d.expires_in,10) - 60) * 1000;
  return _fbToken;
}

async function _getToken(){
  if(!_fbToken)                    return _fbSignIn();
  if(Date.now() >= _fbTokenExpiry) return _fbRefresh();
  return _fbToken;
}

// ---- saveDB: write to localStorage cache AND Firebase ----
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  _ownSaveTs = Date.now();
  _getToken().then(tok=>{
    return fetch(`${FIREBASE_URL}/${FB_NODE}.json?auth=${tok}`, {
      method : 'PUT',
      headers: {'Content-Type':'application/json'},
      body   : JSON.stringify(db)
    });
  })
  .then(()=>{ _fbOnline=true; })
  .catch(e=>{ console.warn('Firebase write failed:', e); });
}

// ---- Convert a Firebase value back to a proper JS array ----
// Firebase stores [] as null, and arrays as {0:{..},1:{..}} objects.
function _toArr(val){
  if(!val) return [];                        // null / undefined → []
  if(Array.isArray(val)) return val;         // already fine
  if(typeof val==='object')                  // Firebase numeric-key object
    return Object.keys(val)
      .sort((a,b)=>Number(a)-Number(b))
      .map(k=>val[k])
      .filter(v=>v!=null);
  return [];
}

// ---- Re-hydrate all known array fields after a Firebase load ----
function _fixArrays(data){
  // top-level arrays
  data.users                    = _toArr(data.users);
  data.resetTokens              = _toArr(data.resetTokens);

  if(data.meta8){

  }
  // liderStroy
  if(data.liderStroy){
    data.liderStroy.objects     = _toArr(data.liderStroy.objects);
    data.liderStroy.entries     = _toArr(data.liderStroy.entries);
    data.liderStroy.objects.forEach(o=>{ if(o) o.subObjects=_toArr(o.subObjects); });
  }
  // bso
  if(data.bso){
    data.bso.subcategories      = _toArr(data.bso.subcategories);
    data.bso.entries            = _toArr(data.bso.entries);
    data.bso.subcategories.forEach(s=>{ if(s) s.subObjects=_toArr(s.subObjects); });
  }
  // metaPlan
  if(data.metaPlan)             data.metaPlan.entries       = _toArr(data.metaPlan.entries);
  // kasaVarna
  if(data.kasaVarna)            data.kasaVarna.entries      = _toArr(data.kasaVarna.entries);
  // kasaPavlikeni
  if(data.kasaPavlikeni)        data.kasaPavlikeni.entries  = _toArr(data.kasaPavlikeni.entries);
  // investments
  if(data.investments){
    data.investments.objects    = _toArr(data.investments.objects);
    data.investments.entries    = _toArr(data.investments.entries);
    data.investments.objects.forEach(o=>{ if(o) o.subObjects=_toArr(o.subObjects); });
  }
  // bsoDzzd
  if(data.bsoDzzd){
    data.bsoDzzd.objects        = _toArr(data.bsoDzzd.objects);
    data.bsoDzzd.entries        = _toArr(data.bsoDzzd.entries);
    data.bsoDzzd.objects.forEach(o=>{ if(o) o.subObjects=_toArr(o.subObjects); });
  }
  return data;
}

// ---- Merge helper: fill any missing top-level keys after loading from FB ----
function _mergeDefaults(remote){
  const d = defaultDB();
  Object.keys(d).forEach(k=>{ if(remote[k]===undefined) remote[k]=d[k]; });
  return _fixArrays(remote);   // always re-hydrate arrays after merge
}

// ---- seedData: clean up duplicate productions and ensure users exist ----
function seedData(){
  let changed = false;

  // 1. Remove any p_* productions that were erroneously seeded in a previous deployment
  const before = db.meta8.productions.length;
  db.meta8.productions = db.meta8.productions.filter(p=>!p.id.startsWith('p_'));
  if(db.meta8.productions.length !== before) changed = true;

  // 2. Patch admin password if changed
  const adminUser = db.users.find(u=>u.id==='u_admin');
  if(adminUser && adminUser.password !== 'FinancePro_2026'){
    adminUser.password = 'FinancePro_2026'; changed = true;
  }

  // 3. Seed users (insert if missing; patch role/company/meta8Prods if changed)
  SEED_USERS.forEach(su=>{
    const existing = db.users.find(u=>u.email.toLowerCase()===su.email.toLowerCase());
    if(!existing){
      db.users.push({...su});
      changed = true;
    } else {
      // Patch role/company/meta8Prods if seed definition changed
      if((existing.meta8Prods||[]).some(p=>p.startsWith('p_'))){
        existing.meta8Prods = su.meta8Prods; changed = true;
      }
      if(existing.role !== su.role){ existing.role = su.role; changed = true; }
      if(JSON.stringify(existing.company) !== JSON.stringify(su.company)){ existing.company = su.company; changed = true; }
      if(su.manageLiderStroy && !existing.manageLiderStroy){ existing.manageLiderStroy = true; changed = true; }
      if(su.manager && !existing.manager){ existing.manager = true; changed = true; }
    }
  });

  if(changed) saveDB();
}

// ---- initDB: load latest data from Firebase on startup ----
async function initDB(){
  try {
    const tok = await _getToken();
    const res = await fetch(`${FIREBASE_URL}/${FB_NODE}.json?auth=${tok}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data && data.users){
      db = _mergeDefaults(data);
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      _fbOnline = true;
    } else {
      // Firebase is empty → push our local/default data up
      saveDB();
    }
    // Always ensure seed data exists (idempotent — only writes if something is missing)
    seedData();
  } catch(e){
    console.warn('Firebase init failed, using local cache:', e);
    _fbOnline = false;
  }
}

// ---- startRealtimeSync: SSE listener — fires whenever any device saves ----
async function startRealtimeSync(){
  if(_fbEvtSrc){ _fbEvtSrc.close(); }
  _fbFirstEvent = true;
  try {
    const tok = await _getToken();
    _fbEvtSrc = new EventSource(`${FIREBASE_URL}/${FB_NODE}.json?auth=${tok}`);
  } catch(e){
    console.warn('SSE auth failed, retrying in 15s:', e);
    setTimeout(startRealtimeSync, 15000);
    return;
  }

  _fbEvtSrc.addEventListener('put', evt=>{
    // 1. Skip the very first event — it's the initial full-db snapshot we
    //    already loaded in initDB(). Processing it causes an immediate re-render
    //    that resets any open modal the user might have started filling in.
    if(_fbFirstEvent){ _fbFirstEvent = false; return; }

    // 2. Suppress echo of our own saves for up to 6 seconds
    if(Date.now() - _ownSaveTs < 6000) return;

    try {
      const pl = JSON.parse(evt.data);
      const incoming = pl.data;
      if(incoming && incoming.users){
        db = _mergeDefaults(incoming);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        _fbOnline = true;
        // 3. If a modal is open, defer the render so we don't wipe the user's form
        if(S.modal){
          _pendingRender = true;
        } else {
          render(); // safe to re-render — no modal is open
        }
      }
    } catch(_){}
  });

  _fbEvtSrc.addEventListener('error', ()=>{
    _fbOnline = false;
    _fbEvtSrc.close();
    // Token may have expired — get a fresh one before reconnecting
    setTimeout(startRealtimeSync, 10000);
  });
}

function fmt(n){
  if(n===undefined||n===null||isNaN(n)) return '0.00';
  return Number(n).toLocaleString('bg-BG',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtShort(n){
  const abs=Math.abs(Number(n)||0);
  if(abs>=1000000) return (n/1000000).toFixed(1)+'M';
  if(abs>=1000) return (n/1000).toFixed(0)+'К';
  return fmt(n);
}

function login(email, password){
  const u = db.users.find(u=>u.email.toLowerCase()===email.toLowerCase() && u.password===password);
  if(!u) return {ok:false, msg:'Грешен имейл или парола'};
  if(!u.confirmed) return {ok:false, msg:'Акаунтът не е потвърден'};
  session = {userId:u.id, email:u.email, name:u.name, role:u.role, company:u.company||[], meta8Prods:u.meta8Prods||[]};
  saveSession();
  return {ok:true};
}

  session = null;

  render();
}

function register(email, password, name, company){
  if(db.users.find(u=>u.email.toLowerCase()===email.toLowerCase()))
    return {ok:false, msg:'Имейлът вече е регистриран'};
  // company is always stored as array
  const compArr = Array.isArray(company) ? company : (company ? [company] : []);
  const u = {id:genId(), email, password, name, role:'user', confirmed:false, company:compArr, createdAt:new Date().toISOString()};
  db.users.push(u);
  saveDB();
  return {ok:true};
}

function isAdmin(){ return session && session.role==='admin'; }
// canWrite: any logged-in user who can view a company can also add/edit entries in it
function canWrite(comp){ return canView(comp); }
// canManageLSObjects: admin OR user with manageLiderStroy flag can add objects/sub-objects
function canManageLSObjects(){
  if(isAdmin()) return true;
  const u = session ? db.users.find(u=>u.id===session.userId) : null;
  return !!(u && u.manageLiderStroy);
}
// canDeleteEntry: admin OR manager user who can already write to that company
function canDeleteEntry(comp){
  if(isAdmin()) return true;
  const u = session ? db.users.find(u=>u.id===session.userId) : null;
  return !!(u && u.manager) && canWrite(comp);
}
function canView(comp){
  if(isAdmin()) return true;
  if(!session) return false;
  const c = session.company;
  if(!c) return false;
  if(c==='all') return true;
  if(c===comp) return true; // legacy single string
  if(Array.isArray(c)) return c.includes('all') || c.includes(comp);
  return false;
}

// Returns null (= full access) or array of lowercase keyword strings for this user's Meta8 access
function getAccessibleMeta8ProdIds(){
  if(isAdmin()) return null;
  // Always read fresh from DB to avoid stale session data (e.g. old p_* IDs from before patching)
  const u = session ? db.users.find(u=>u.id===session.userId) : null;
  const kws = (u ? (u.meta8Prods||[]) : (session?.meta8Prods||[]));
  if(kws.length === 0) return null; // no restriction → full access
  // Safety: if ALL keywords look like old p_* IDs (stale data), fall back to full access
  if(kws.every(k => k.startsWith('p_'))) return null;
  return kws;
}

// Match by name substring (case-insensitive) so access doesn't depend on production IDs
function canViewMeta8Prod(prodId){
  const keywords = getAccessibleMeta8ProdIds();
  if(keywords === null) return true;
  const prod = db.meta8.productions.find(p=>p.id===prodId);
  if(!prod) return false;
  const name = prod.name.toLowerCase();
  return keywords.some(kw=>name.includes(kw.toLowerCase()));
}

}

// ================== CALCULATIONS ==================
function getEntries(company, entityId, year, month){
  const src = db[company]?.entries || [];
  return src.filter(e=>{
    if(e.year!==year||e.month!==month) return false;
    if(entityId!==null && e.entityId!==entityId) return false;
    return true;
  });
}

function getAllEntries(company, entityId){
  const src = db[company]?.entries || [];
  if(entityId===null) return src;
  return src.filter(e=>e.entityId===entityId);
}

function sumEntries(entries){
  return entries.reduce((a,e)=>({
    income:a.income+(e.income||0),
    expenses:a.expenses+(e.expenses||0),
    tonnage:a.tonnage+(e.tonnage||0),
    expWorkers:a.expWorkers+(e.expWorkers||0),
    expAdditional:a.expAdditional+(e.expAdditional||0)
  }), {income:0,expenses:0,tonnage:0,expWorkers:0,expAdditional:0});
}

function getMonthTotals(company, entityId, year, month){
  return sumEntries(getEntries(company, entityId, year, month));
}

function getYearTotals(company, entityId, year){
  const src = (db[company]?.entries||[]).filter(e=>e.year===year && (entityId===null||e.entityId===entityId));
  return sumEntries(src);
}

function getCompanyMonthTotals(company, year, month){
  const src = (db[company]?.entries||[]).filter(e=>e.year===year&&e.month===month);
  return sumEntries(src);
}

function getHoldingTotals(year, month){
  const comps = ['meta8','liderStroy','bso','metaPlan','investments','kasaVarna','kasaPavlikeni','bsoDzzd'];
  return comps.reduce((a,c)=>{
    const t=getCompanyMonthTotals(c,year,month);
    return {income:a.income+t.income, expenses:a.expenses+t.expenses};
  },{income:0,expenses:0});
}

function getLSRemainder(objId){
  const budget = db.liderStroy.objects.find(o=>o.id===objId)?.budget||0;
  const allExp = (db.liderStroy.entries||[]).filter(e=>e.entityId===objId).reduce((a,e)=>a+(e.expenses||0),0);
  return budget - allExp;
}

function getBSORemainder(subcatId){
  const budget = db.bso.subcategories.find(s=>s.id===subcatId)?.budget||0;
  const allExp = (db.bso.entries||[]).filter(e=>e.entityId===subcatId).reduce((a,e)=>a+(e.expenses||0),0);
  return budget - allExp;
}

function getInvEntriesBySubObj(objId, subObjId, year, month){
  return (db.investments.entries||[]).filter(e=>
    e.entityId===objId && e.year===year && e.month===month &&
    (subObjId ? e.subEntityId===subObjId : true)
  );
}

function getBSOEntriesBySubObj(catId, subObjId, year, month){
  return (db.bso.entries||[]).filter(e=>
    e.entityId===catId && e.year===year && e.month===month &&
    (subObjId ? e.subEntityId===subObjId : true)
  );
}

function getBsoDzzdRemainder(objId){
  const budget = (db.bsoDzzd.objects||[]).find(o=>o.id===objId)?.budget||0;
  const allExp = (db.bsoDzzd.entries||[]).filter(e=>e.entityId===objId).reduce((a,e)=>a+(e.expenses||0),0);
  return budget - allExp;
}

function getBsoDzzdEntriesBySubObj(objId, subObjId, year, month){
  return (db.bsoDzzd.entries||[]).filter(e=>
    e.entityId===objId && e.year===year && e.month===month &&
    (subObjId ? e.subEntityId===subObjId : true)
  );
}

function renderMonthNav(){
  const yrs = [2023,2024,2025,2026];
  const yearOpts = yrs.map(y=>`<option value="${y}" ${S.year===y?'selected':''}>${y}</option>`).join('');

  return `
  <div class="month-nav">
    <i class="fa fa-calendar-alt" style="color:#c00;font-size:13px"></i>

}

function renderMeta8(){
  if(!canView('meta8')) return noAccess();
  // Filter productions by what this user is allowed to see (name-keyword match)
  const prods = db.meta8.productions.filter(p=>canViewMeta8Prod(p.id));
  // Overall totals only for accessible productions
  const overallEntries = (db.meta8.entries||[]).filter(e=>
    e.year===S.year && e.month===S.month && canViewMeta8Prod(e.entityId)
  );
  const overall = sumEntries(overallEntries);
  const overallResult = overall.income - overall.expenses;

  // If the previously selected production is not accessible, fall back to first visible one
  const selProd = (S.selEntity && prods.find(p=>p.id===S.selEntity))
    ? S.selEntity
    : (prods[0]?.id||null);

  const prodTabs = prods.map(p=>`
    <div class="tab ${selProd===p.id?'active':''}" onclick="S.selEntity='${p.id}';render()">${p.name}</div>
  `).join('');

  const prodData = selProd ? getMonthTotals('meta8', selProd, S.year, S.month) : null;
  const entries = selProd ? getEntries('meta8', selProd, S.year, S.month) : [];

  const totalExp = prodData ? prodData.expWorkers + prodData.expAdditional : 0;

function getLSEntriesBySubObj(objId, subObjId, year, month){
  return (db.liderStroy.entries||[]).filter(e=>
    e.entityId===objId && e.year===year && e.month===month &&
    (subObjId ? e.subEntityId===subObjId : true)
  );
}

function exportBackup(){
  const now = new Date();
  const stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const payload = JSON.stringify(db, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'finance-pro-backup-'+stamp+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm('ВНИМАНИЕ: Това ще замени ВСИЧКИ текущи данни с тези от backup файла. Сигурни ли сте?')) {
    input.value=''; return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const restored = JSON.parse(e.target.result);
      if(!restored.users || !restored.meta8) throw new Error('Невалиден backup файл');
      db = _fixArrays(restored);
      saveDB();
      render();
      alert('✅ Данните са възстановени успешно!');
    } catch(err) {
      alert('❌ Грешка при четене на файла: ' + err.message);
    }
    input.value='';
  };
  reader.readAsText(file);
}

}

// =================== CHARTS ===================
function renderCharts(){
  // Destroy existing
  Object.values(S.charts||{}).forEach(c=>c.destroy&&c.destroy());
  S.charts = {};

  const chartDefs = [
    {id:'chart-trend', dataId:'trend-data', type:'trend'},
    {id:'chart-pie', dataId:'pie-data', type:'pie'},
    {id:'chart-meta8', dataId:'meta8-trend', type:'trend'},
    {id:'chart-metaplan', dataId:'metaplan-trend', type:'trend'},
    {id:'chart-kasaVarna', dataId:'chart-kasaVarna-data', type:'trend'},
    {id:'chart-kasaPavlikeni', dataId:'chart-kasaPavlikeni-data', type:'trend'},
  ];

  chartDefs.forEach(({id,dataId,type})=>{
    const canvas = document.getElementById(id);
    const dataEl = document.getElementById(dataId);
    if(!canvas||!dataEl) return;
    const data = JSON.parse(dataEl.textContent||'[]');
    if(type==='trend') createTrendChart(id, data, canvas);
    else if(type==='pie') createPieChart(id, data, canvas);
  });
}

function createTrendChart(id, data, canvas){
  const ctx = canvas.getContext('2d');
  S.charts[id] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:data.map(d=>d.label),
      datasets:[
        {label:'Приходи',data:data.map(d=>d.income),backgroundColor:'rgba(34,197,94,.7)',borderColor:'#22c55e',borderWidth:1,borderRadius:4},
        {label:'Разходи',data:data.map(d=>d.expenses),backgroundColor:'rgba(239,68,68,.7)',borderColor:'#ef4444',borderWidth:1,borderRadius:4},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#666',font:{size:11}}},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#ddd',bodyColor:'#888',borderColor:'#2a2a2a',borderWidth:1}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#555',font:{size:11}}},
        y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#555',font:{size:11},callback:v=>fmtShort(v)}}
      }
    }
  });
}

function createPieChart(id, data, canvas){
  const filtered = data.filter(d=>d.income>0);
  if(!filtered.length){
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('Няма данни за избрания период',canvas.width/2,canvas.height/2);
    return;
  }
  const ctx = canvas.getContext('2d');
  S.charts[id] = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:filtered.map(d=>d.label),
      datasets:[{data:filtered.map(d=>d.income),backgroundColor:filtered.map(d=>d.color),borderColor:'#111',borderWidth:2,hoverOffset:8}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'65%',
      plugins:{legend:{position:'right',labels:{color:'#666',font:{size:11},boxWidth:12,padding:12}},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#ddd',bodyColor:'#888',borderColor:'#2a2a2a',borderWidth:1,callbacks:{label:ctx=>`${ctx.label}: ${fmtShort(ctx.raw)} €`}}}
    }
  });
}

function bindEvents(){
  document.getElementById('login-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const email=document.getElementById('l-email').value.trim();
    const pass=document.getElementById('l-pass').value;
    const r=login(email,pass);
    if(r.ok){ S.view='dashboard'; render(); }
    else notify(r.msg,'err');
  });

  document.getElementById('reg-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const name=document.getElementById('r-name').value.trim();
    const email=document.getElementById('r-email').value.trim();
    const pass=document.getElementById('r-pass').value;
    const pass2=document.getElementById('r-pass2').value;
    if(pass!==pass2){ notify('Паролите не съвпадат','err'); return; }
    const companies=getSelectedCompanies();
    if(companies.length===0){ notify('Изберете поне една фирма','err'); return; }
    const r=register(email,pass,name,companies);
    if(r.ok){ notify('Заявката е изпратена! Изчакайте потвърждение от администратор.','ok'); setTimeout(()=>{S.view='login';render();},2200); }
    else notify(r.msg,'err');
  });

  document.getElementById('forgot-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const email=document.getElementById('fp-email').value.trim();
    const result=handleForgotPassword(email);
    const div=document.getElementById('fp-result');
    if(!div) return;
    if(result.ok){
      div.innerHTML=`
        <div style="background:#f9fafb;border:1px solid #22c55e44;border-radius:8px;padding:14px">
          <div style="font-size:12px;color:#22c55e;font-weight:700;margin-bottom:8px"><i class="fa fa-check-circle"></i> Линкът е генериран</div>
          <p style="font-size:11px;color:#666;margin-bottom:10px">Тъй като приложението работи без сървър, копирайте линка по-долу и го изпратете на потребителя:</p>
          <div style="background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:11px;font-family:monospace;color:#6b7280;word-break:break-all;margin-bottom:8px">${result.resetUrl}</div>
          <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${result.resetUrl}').then(()=>notify('Копирано!','ok'))"><i class="fa fa-copy"></i> Копирай линка</button>
        </div>`;
    } else {
      div.innerHTML=`<div style="color:#ef4444;font-size:13px;padding:10px"><i class="fa fa-times-circle"></i> ${result.msg}</div>`;
    }
  });

  document.getElementById('reset-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const token=e.target.dataset.token;
    const pass=document.getElementById('rp-pass').value;
    const pass2=document.getElementById('rp-pass2').value;
    if(pass!==pass2){ notify('Паролите не съвпадат','err'); return; }
    if(pass.length<6){ notify('Паролата трябва да е поне 6 символа','err'); return; }
    const result=doResetPassword(token,pass);
    if(result.ok){
      notify('Паролата е променена успешно!','ok');
      setTimeout(()=>{ window.location.href=window.location.pathname; },2000);
    } else {
      notify(result.msg,'err');
    }
  });

  document.getElementById('m-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    try {
      handleModalSubmit();
    } catch(err){
      console.error('handleModalSubmit error:', err);
      notify('Грешка при запазване: ' + err.message, 'err');
    }
  });
}

function handleModalSubmit(){
  const {modal, mdata} = S;

  if(modal==='editEntry'){
    const company = mdata.company;
    const entry = (db[company]?.entries||[]).find(e=>e.id===mdata.entryId);
    if(!entry){ notify('Записът не е намерен','err'); return; }
    entry.description = (document.getElementById('f-desc')?.value||'').trim();
    if(company==='meta8'){
      entry.tonnage      = parseFloat(document.getElementById('f-ton')?.value)||0;
      entry.income       = parseFloat(document.getElementById('f-inc')?.value)||0;
      entry.expWorkers   = parseFloat(document.getElementById('f-ew')?.value)||0;
      entry.expAdditional= parseFloat(document.getElementById('f-ea')?.value)||0;
      entry.expenses     = entry.expWorkers + entry.expAdditional;
    } else {
      const subObjEl = document.getElementById('f-subobj');
      if(subObjEl) entry.subEntityId = subObjEl.value||null;
      entry.income   = parseFloat(document.getElementById('f-inc')?.value)||0;
      entry.expenses = parseFloat(document.getElementById('f-exp')?.value)||0;
    }
    saveDB(); closeModal(); notify('Записът е обновен','ok');
  }
  else if(modal==='addMeta8Entry'){
    const entry = {
      id:genId(), entityId:mdata.entityId, year:S.year, month:S.month,
      description:document.getElementById('f-desc').value.trim(),
      tonnage:parseFloat(document.getElementById('f-ton').value)||0,
      income:parseFloat(document.getElementById('f-inc').value)||0,
      expenses:0,
      expWorkers:parseFloat(document.getElementById('f-ew').value)||0,
      expAdditional:parseFloat(document.getElementById('f-ea').value)||0,
      createdBy:session.email, createdAt:new Date().toISOString()
    };
    entry.expenses = entry.expWorkers + entry.expAdditional;
    db.meta8.entries.push(entry);
    saveDB(); closeModal(); notify('Записът е запазен','ok');

  else if(modal==='addProduction'){

      income:parseFloat(document.getElementById('f-inc').value)||0,

      createdBy:session.email, createdAt:new Date().toISOString()
    };
    if(!db.bsoDzzd.entries) db.bsoDzzd.entries=[];
    db.bsoDzzd.entries.push(entry);
    saveDB(); closeModal(); notify('Записът е запазен','ok');
  }
  else if(modal==='addInvEntry'){
    const subObjEl = document.getElementById('f-subobj');
    const entry = {
      id:genId(), entityId:mdata.entityId||null,
      subEntityId: subObjEl?.value || null,
      year:S.year, month:S.month,
      description:document.getElementById('f-desc').value.trim(),
      income:parseFloat(document.getElementById('f-inc').value)||0,
      expenses:parseFloat(document.getElementById('f-exp').value)||0,
      createdBy:session.email, createdAt:new Date().toISOString()
    };
    db.investments.entries.push(entry);
    saveDB(); closeModal(); notify('Записът е запазен','ok');
  }
  else if(modal==='addBSOObject'){
    const name=document.getElementById('f-name').value.trim();
    const budget=parseFloat(document.getElementById('f-budget').value)||0;
    if(!name) return;
    const sub={id:genId(),name,budget};
    db.bso.subcategories.push(sub);
    S.selEntity=sub.id;
    saveDB(); closeModal(); notify('Обектът е добавен','ok');
  }
  else if(modal==='editBSOBudget'){
    const cat=db.bso.subcategories.find(s=>s.id===mdata.entityId);
    if(cat){ cat.budget=parseFloat(document.getElementById('f-budget').value)||0; saveDB(); closeModal(); notify('Бюджетът е актуализиран','ok'); }
  }
  else if(modal==='addInvObject'){
    const name=document.getElementById('f-name').value.trim();
    if(!name) return;
    const obj={id:genId(),name,subObjects:[]};
    db.investments.objects.push(obj);
    S.selEntity=obj.id;
    S.selSubEntity=null;
    saveDB(); closeModal(); notify('Обектът е добавен','ok');
  }
  else if(modal==='addInvSubObj'){
    const name=document.getElementById('f-name').value.trim();
    if(!name) return;
    const obj=db.investments.objects.find(o=>o.id===mdata.entityId);
    if(!obj.subObjects) obj.subObjects=[];
    const sub={id:genId(),name};
    obj.subObjects.push(sub);
    S.selSubEntity=sub.id;
    saveDB(); closeModal(); notify('Подобектът е добавен','ok');
  }
  else if(modal==='addUser'){
    const name=document.getElementById('f-name').value.trim();
    const email=document.getElementById('f-email').value.trim();
    const pass=document.getElementById('f-pass').value;
    const pass2=document.getElementById('f-pass2').value;
    const role=document.getElementById('f-role').value;
    if(pass!==pass2){ notify('Паролите не съвпадат','err'); return; }
    if(pass.length<6){ notify('Паролата трябва да е поне 6 символа','err'); return; }
    const companies=getSelectedCompanies();
    if(companies.length===0){ notify('Изберете поне една фирма','err'); return; }
    if(db.users.find(u=>u.email.toLowerCase()===email.toLowerCase())){ notify('Имейлът вече съществува','err'); return; }
    db.users.push({id:genId(),email,password:pass,role,name,confirmed:true,company:companies,createdAt:new Date().toISOString()});
    saveDB(); closeModal(); notify('Потребителят е създаден','ok');
  }
}

// =================== FORGOT / RESET PASSWORD ===================
function handleForgotPassword(email){
  const u=db.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
  if(!u) return {ok:false, msg:'Имейлът не е намерен в системата'};
  if(!db.resetTokens) db.resetTokens=[];
  // Remove old tokens for this user
  db.resetTokens=db.resetTokens.filter(t=>t.userId!==u.id);
  const token=genId()+genId()+genId();
  const expiresAt=new Date(Date.now()+24*60*60*1000).toISOString();
  db.resetTokens.push({token,userId:u.id,expiresAt});
  saveDB();
  const resetUrl=window.location.href.split('?')[0]+'?reset='+token;
  return {ok:true, resetUrl, email:u.email};
}

function doResetPassword(token, newPass){
  if(!db.resetTokens) return {ok:false,msg:'Невалиден токен'};
  const rec=db.resetTokens.find(t=>t.token===token && new Date(t.expiresAt)>new Date());
  if(!rec) return {ok:false,msg:'Линкът е изтекъл или вече е използван'};
  const u=db.users.find(u=>u.id===rec.userId);
  if(!u) return {ok:false,msg:'Потребителят не е намерен'};
  u.password=newPass;
  db.resetTokens=db.resetTokens.filter(t=>t.token!==token);
  saveDB();
  return {ok:true};
}

// =================== INIT ===================
// Fix any arrays in the localStorage cache now that _fixArrays is defined
try { db = _fixArrays(db); } catch(_){}

// Immediately remove any erroneously-seeded p_* productions
if(db.meta8) db.meta8.productions = (db.meta8.productions||[]).filter(p=>!p.id.startsWith('p_'));

// 1. Render immediately with cached/local data (no delay for user)
render();
// 2. Sign in to Firebase → load latest data → start live sync
_fbSignIn()
  .then(()=> initDB())
  .then(()=>{ render(); startRealtimeSync(); })
  .catch(e=>{ console.warn('Firebase startup failed:', e); render(); });
</script>
