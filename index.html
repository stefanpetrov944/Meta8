}

<body>
<div id="app"></div>

<script>
// ================== CONSTANTS ==================
const MONTHS = ['Јануари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
const DB_KEY  = 'fph_db_v2';
const SES_KEY = 'fph_ses_v2';
const FIREBASE_URL = 'https://finance-pro-holding-default-rtdb.firebaseio.com';
const FB_NODE      = 'fph_v1'; // path in Firebase Realtime Database

// ================== DEFAULT DATA ==================
function defaultDB() {
  return {
    users: [{
      id:'u_admin', email:'admin@meta8.bg', password:'admin1234',
      role:'admin', name:'Администратор', confirmed:true, company:'all',
      createdAt:'2024-01-01T00:00:00Z'
    }],
    meta8: {
      productions:[{id:'p1', name:'Основно производство', createdAt:'2024-01-01T00:00:00Z'}],
      entries:[]
    },
    liderStroy: {
      objects:[{id:'lo1', name:'Обект 1', budget:500000, subObjects:[]}],
      entries:[]
    },
    bso: {
      subcategories:[
        {id:'b1',name:'Индустриален парк',budget:0},
        {id:'b2',name:'Църква Свищов',budget:0},
        {id:'b3',name:'Парк Калето',budget:0},
        {id:'b4',name:'Лаборатория Индустриален парк Свищов',budget:0},
        {id:'b5',name:'Спортна зала Свищов',budget:0},
        {id:'b6',name:'Офис Свищов',budget:0},
        {id:'b7',name:'Плевен-Рубин Eco Collection',budget:0},
        {id:'b8',name:'Бяла Сметище',budget:0},
        {id:'b9',name:'Плевен Блок за Саниране #1',budget:0},
        {id:'b10',name:'Блок за Саниране #2',budget:0}
      ],
      entries:[]
    },
    metaPlan:{ entries:[] },
    kasaVarna:{ entries:[] },
    kasaPavlikeni:{ entries:[] },
    investments:{
      objects:[
        {id:'i1',name:'Радиозавод',subObjects:[]},
        {id:'i2',name:'Администрация на радиозавод',subObjects:[]},
        {id:'i3',name:'Магазини',subObjects:[]},
        {id:'i4',name:'Офис над магазини',subObjects:[]},
        {id:'i5',name:'Автомивка',subObjects:[]},
        {id:'i6',name:'Спортни съоражения',subObjects:[]}
      ],
      entries:[]
    },
    resetTokens:[]
  };
}

// ================== DB & SESSION ==================
// Start with localStorage cache immediately (instant UI), then sync from Firebase
let db = (()=>{ try{ const s=localStorage.getItem(DB_KEY); return s ? JSON.parse(s) : defaultDB(); }catch(e){ return defaultDB(); }})();
let session = (()=>{ try{ const s=localStorage.getItem(SES_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }})();

let _fbEvtSrc  = null;   // SSE EventSource for real-time sync
let _fbOnline  = false;  // is Firebase reachable?
let _ownSaveTs = 0;      // timestamp of our last save (to suppress echo)

// ---- saveDB: write to localStorage cache AND Firebase ----
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  _ownSaveTs = Date.now();
  fetch(`${FIREBASE_URL}/${FB_NODE}.json`, {
    method : 'PUT',
    headers: {'Content-Type':'application/json'},
    body   : JSON.stringify(db)
  })
  .then(()=>{ _fbOnline=true; })
  .catch(e=>{ console.warn('Firebase write failed:', e); });
}

// ---- Merge helper: fill any missing top-level keys after loading from FB ----
function _mergeDefaults(remote){
  const d = defaultDB();
  Object.keys(d).forEach(k=>{ if(remote[k]===undefined) remote[k]=d[k]; });
  return remote;
}

// ---- initDB: load latest data from Firebase on startup ----
async function initDB(){
  try {
    const res = await fetch(`${FIREBASE_URL}/${FB_NODE}.json`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data && data.users){
      db = _mergeDefaults(data);
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      _fbOnline = true;
    } else {
      // Firebase is empty → push our local/default data up
      saveDB();
    }
  } catch(e){
    console.warn('Firebase init failed, using local cache:', e);
    _fbOnline = false;
  }
}

// ---- startRealtimeSync: SSE listener — fires whenever any device saves ----
function startRealtimeSync(){
  if(_fbEvtSrc){ _fbEvtSrc.close(); }
  _fbEvtSrc = new EventSource(`${FIREBASE_URL}/${FB_NODE}.json`);

  _fbEvtSrc.addEventListener('put', evt=>{
    // Suppress echo from our own saves (within 3 s)
    if(Date.now() - _ownSaveTs < 3000) return;
    try {
      const pl = JSON.parse(evt.data);
      const incoming = pl.data;
      if(incoming && incoming.users){
        db = _mergeDefaults(incoming);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        _fbOnline = true;
        render();        // refresh UI with data from other device
      }
    } catch(_){}
  });

  _fbEvtSrc.addEventListener('error', ()=>{
    _fbOnline = false;
    _fbEvtSrc.close();
    setTimeout(startRealtimeSync, 10000); // reconnect after 10 s
  });
}

function saveSession(){ if(session) localStorage.setItem(SES_KEY, JSON.stringify(session)); else localStorage.removeItem(SES_KEY); }

// ================== STATE ==================
let S = {
  view: session ? 'dashboard' : 'login',
  company: null,
  selEntity: null,
  selSubEntity: null, // selected sub-object id (LiderStroy)
  month: new Date().getMonth()+1,
  year: new Date().getFullYear(),
  sidebarOpen: false,
  modal: null,
  mdata: {}
};

// ================== UTILS ==================
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmt(n){
  if(n===undefined||n===null||isNaN(n)) return '0.00';
  return Number(n).toLocaleString('bg-BG',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtShort(n){
  const abs=Math.abs(Number(n)||0);
  if(abs>=1000000) return (n/1000000).toFixed(1)+'M';
  if(abs>=1000) return (n/1000).toFixed(0)+'К';
  return fmt(n);
}

function resultClass(n){ return n>0 ? 'text-pos' : n<0 ? 'text-neg' : 'text-neu'; }
function resultBadge(n){ return n>0 ? 'badge-green' : n<0 ? 'badge-red' : 'badge-gray'; }

function notify(msg, type='ok'){
  const el = document.createElement('div');
  el.className = `notice notice-${type==='ok'?'ok':type==='err'?'err':'info'}`;
  el.innerHTML = `<i class="fa ${type==='ok'?'fa-check-circle text-pos':type==='err'?'fa-times-circle text-neg':'fa-info-circle text-red'}"></i><span style="font-size:13px;color:#ccc;flex:1">${msg}</span><i class="fa fa-times" style="color:#444;cursor:pointer;font-size:12px" onclick="this.parentElement.remove()"></i>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.animation='nIn .3s ease reverse'; setTimeout(()=>el.remove(),280); }, 3200);
}

// ================== AUTH ==================
function login(email, password){
  const u = db.users.find(u=>u.email.toLowerCase()===email.toLowerCase() && u.password===password);
  if(!u) return {ok:false, msg:'Грешен имейл или парола'};
  if(!u.confirmed) return {ok:false, msg:'Акаунтът не е потвърден'};
  session = {userId:u.id, email:u.email, name:u.name, role:u.role, company:u.company||[]};
  saveSession();
  return {ok:true};
}

function logout(){
  session = null;
  saveSession();
  S.view='login'; S.company=null; S.selEntity=null;
  render();
}

function register(email, password, name, company){
  if(db.users.find(u=>u.email.toLowerCase()===email.toLowerCase()))
    return {ok:false, msg:'Имейлът вече е регистриран'};
  // company is always stored as array
  const compArr = Array.isArray(company) ? company : (company ? [company] : []);
  const u = {id:genId(), email, password, name, role:'user', confirmed:false, company:compArr, createdAt:new Date().toISOString()};
  db.users.push(u);
  saveDB();
  return {ok:true};
}

function isAdmin(){ return session && session.role==='admin'; }
function canView(comp){
  if(isAdmin()) return true;
  if(!session) return false;
  const c = session.company;
  if(!c) return false;
  if(c==='all') return true;
  if(c===comp) return true; // legacy single string
  if(Array.isArray(c)) return c.includes('all') || c.includes(comp);
  return false;
}

// ================== RESET TOKEN URL CHECK ==================
const _urlReset = new URLSearchParams(window.location.search).get('reset');

// ================== PASSWORD / COMPANY HELPERS ==================
function togglePwd(inputId, iconEl){
  const inp = document.getElementById(inputId);
  if(!inp) return;
  if(inp.type==='password'){ inp.type='text'; iconEl.className='fa fa-eye-slash'; }
  else { inp.type='password'; iconEl.className='fa fa-eye'; }
}

function toggleAllCompanies(el){
  document.querySelectorAll('input[name="companies"]').forEach(cb=>{ if(cb.value!=='all') cb.checked=el.checked; });
}

function updateAllCheckbox(){
  const cbs = Array.from(document.querySelectorAll('input[name="companies"]:not([value="all"])'));
  const allCb = document.getElementById('fc-all');
  if(allCb) allCb.checked = cbs.length>0 && cbs.every(cb=>cb.checked);
}

function getSelectedCompanies(){
  const allCb = document.getElementById('fc-all');
  if(allCb?.checked) return ['all'];
  return Array.from(document.querySelectorAll('input[name="companies"]:not([value="all"])')).filter(cb=>cb.checked).map(cb=>cb.value);
}

function companiesLabel(company){
  const map = {all:'Всички',meta8:'Мета 8',liderStroy:'Лидерстрой',bso:'БСО',metaPlan:'Мета План',investments:'Инвестиции',kasaVarna:'Каса Варна',kasaPavlikeni:'Каса Павликени'};
  if(!company) return '—';
  if(company==='all') return 'Всички';
  if(typeof company==='string') return map[company]||company;
  if(Array.isArray(company)){
    if(company.includes('all')) return 'Всички';
    return company.map(c=>map[c]||c).join(', ');
  }
  return '—';
}

function companyCheckboxes(selected){
  const list=[
    {v:'all',   l:'Всички'},
    {v:'meta8', l:'Мета 8'},
    {v:'liderStroy', l:'Лидерстрой'},
    {v:'bso',   l:'БСО'},
    {v:'metaPlan', l:'Мета План'},
    {v:'investments',l:'Инвестиции'},
    {v:'kasaVarna', l:'Каса Варна'},
    {v:'kasaPavlikeni',l:'Каса Павликени'},
  ];
  const isAll = Array.isArray(selected)?selected.includes('all'):selected==='all';
  return list.map(item=>{
    const checked = isAll || (Array.isArray(selected)?selected.includes(item.v):selected===item.v);
    const extra = item.v==='all' ? `id="fc-all" onchange="toggleAllCompanies(this)"` : `onchange="updateAllCheckbox()"`;
    return `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#ccc;padding:4px 0">
      <input type="checkbox" ${extra} name="companies" value="${item.v}" ${checked?'checked':''} style="width:14px;height:14px;accent-color:#c00;cursor:pointer">
      ${item.l}
    </label>`;
  }).join('');
}

// ================== CALCULATIONS ==================
function getEntries(company, entityId, year, month){
  const src = db[company]?.entries || [];
  return src.filter(e=>{
    if(e.year!==year||e.month!==month) return false;
    if(entityId!==null && e.entityId!==entityId) return false;
    return true;
  });
}

function getAllEntries(company, entityId){
  const src = db[company]?.entries || [];
  if(entityId===null) return src;
  return src.filter(e=>e.entityId===entityId);
}

function sumEntries(entries){
  return entries.reduce((a,e)=>({
    income:a.income+(e.income||0),
    expenses:a.expenses+(e.expenses||0),
    tonnage:a.tonnage+(e.tonnage||0),
    expWorkers:a.expWorkers+(e.expWorkers||0),
    expAdditional:a.expAdditional+(e.expAdditional||0)
  }), {income:0,expenses:0,tonnage:0,expWorkers:0,expAdditional:0});
}

function getMonthTotals(company, entityId, year, month){
  return sumEntries(getEntries(company, entityId, year, month));
}

function getYearTotals(company, entityId, year){
  const src = (db[company]?.entries||[]).filter(e=>e.year===year && (entityId===null||e.entityId===entityId));
  return sumEntries(src);
}

function getCompanyMonthTotals(company, year, month){
  const src = (db[company]?.entries||[]).filter(e=>e.year===year&&e.month===month);
  return sumEntries(src);
}

function getHoldingTotals(year, month){
  const comps = ['meta8','liderStroy','bso','metaPlan','investments','kasaVarna','kasaPavlikeni'];
  return comps.reduce((a,c)=>{
    const t=getCompanyMonthTotals(c,year,month);
    return {income:a.income+t.income, expenses:a.expenses+t.expenses};
  },{income:0,expenses:0});
}

function getLSRemainder(objId){
  const budget = db.liderStroy.objects.find(o=>o.id===objId)?.budget||0;
  const allExp = (db.liderStroy.entries||[]).filter(e=>e.entityId===objId).reduce((a,e)=>a+(e.expenses||0),0);
  return budget - allExp;
}

function getBSORemainder(subcatId){
  const budget = db.bso.subcategories.find(s=>s.id===subcatId)?.budget||0;
  const allExp = (db.bso.entries||[]).filter(e=>e.entityId===subcatId).reduce((a,e)=>a+(e.expenses||0),0);
  return budget - allExp;
}

function getInvEntriesBySubObj(objId, subObjId, year, month){
  return (db.investments.entries||[]).filter(e=>
    e.entityId===objId && e.year===year && e.month===month &&
    (subObjId ? e.subEntityId===subObjId : true)
  );
}

function renderKasa(company, title, icon){
  if(!canView(company)) return noAccess();
  const mt = getCompanyMonthTotals(company, S.year, S.month);
  const result = mt.income - mt.expenses;
  const entries = getEntries(company, null, S.year, S.month);

  const entryRows = entries.length ? entries.map(e=>`
    <tr>
      <td>${e.description||'—'}</td>
      <td class="text-pos">+${fmt(e.income||0)}</td>
      <td class="text-neg">-${fmt(e.expenses||0)}</td>
      <td class="${resultClass((e.income||0)-(e.expenses||0))}">${fmt((e.income||0)-(e.expenses||0))}</td>
      ${isAdmin()?`<td><button class="btn btn-danger btn-sm" onclick="deleteEntry('${company}','${e.id}')"><i class="fa fa-trash"></i></button></td>`:''}
    </tr>`).join('') : `<tr><td colspan="5"><div class="empty-state" style="padding:30px"><i class="fa fa-inbox"></i><p>Няма записи</p></div></td></tr>`;

  const monthRows = MONTHS.map((mn,i)=>{
    const t=getCompanyMonthTotals(company,S.year,i+1);
    const r=t.income-t.expenses;
    return `<tr ${i+1===S.month?'style="background:rgba(204,0,0,.06)"':''}>
      <td style="color:${i+1===S.month?'#fff':'#888'}">${mn}</td>
      <td class="text-pos">${t.income>0?'+'+fmt(t.income):'—'}</td>
      <td class="text-neg">${t.expenses>0?'-'+fmt(t.expenses):'—'}</td>
      <td class="${resultClass(r)}">${t.income||t.expenses?fmt(r):'—'}</td>
    </tr>`;
  }).join('');

  const ytdData = MONTHS.map((mn,i)=>{
    const t=getCompanyMonthTotals(company,S.year,i+1);
    return {label:mn.slice(0,3),income:t.income,expenses:t.expenses};
  });
  const chartId = 'chart-'+company;

  return `
  <div class="section-hd">
    <h2><i class="fa ${icon} text-red" style="margin-right:8px"></i>${title}</h2>
    <p>Приходи, разходи и финансов резултат</p>
  </div>

  <div class="grid-stats">
    <div class="stat-card"><div style="font-size:11px;color:#555;font-weight:700;text-transform:uppercase;margin-bottom:8px">Приходи — ${MONTHS[S.month-1]}</div><div style="font-size:24px;font-weight:800;color:#22c55e">${fmtShort(mt.income)}<span style="font-size:12px;color:#555"> лв.</span></div></div>
    <div class="stat-card"><div style="font-size:11px;color:#555;font-weight:700;text-transform:uppercase;margin-bottom:8px">Разходи — ${MONTHS[S.month-1]}</div><div style="font-size:24px;font-weight:800;color:#ef4444">${fmtShort(mt.expenses)}<span style="font-size:12px;color:#555"> лв.</span></div></div>
    <div class="stat-card"><div style="font-size:11px;color:#555;font-weight:700;text-transform:uppercase;margin-bottom:8px">Резултат</div><div style="font-size:24px;font-weight:800" class="${resultClass(result)}">${fmtShort(result)}<span style="font-size:12px;color:#555"> лв.</span></div></div>
  </div>

  <div class="grid-2" style="margin-top:16px">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:13px;font-weight:700;color:#ddd">Записи — ${MONTHS[S.month-1]} ${S.year}</span>
        ${isAdmin()?`<button class="btn btn-primary btn-sm" onclick="openModal('addKasaEntry',null,'${company}','${title}')"><i class="fa fa-plus"></i> Добави</button>`:''}
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Описание</th><th>Приходи</th><th>Разходи</th><th>Резултат</th>${isAdmin()?'<th></th>':''}</tr></thead>
          <tbody>${entryRows}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:#ddd;margin-bottom:12px">По месеци — ${S.year}</div>
      <div class="table-wrap" style="max-height:340px;overflow-y:auto">
        <table class="tbl">
          <thead><tr><th>Месец</th><th>Приходи</th><th>Разходи</th><th>Резултат</th></tr></thead>
          <tbody>${monthRows}</tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div style="font-size:13px;font-weight:700;color:#ddd;margin-bottom:14px"><i class="fa fa-chart-area text-red" style="margin-right:7px"></i>Годишен тренд ${S.year}</div>
    <div class="chart-wrap"><canvas id="${chartId}"></canvas></div>
  </div>
  <script type="app/data" id="${chartId}-data">${JSON.stringify(ytdData)}<\/script>`;
}

// =================== CHARTS ===================
function renderCharts(){
  // Destroy existing
  Object.values(S.charts||{}).forEach(c=>c.destroy&&c.destroy());
  S.charts = {};

  const chartDefs = [
    {id:'chart-trend', dataId:'trend-data', type:'trend'},
    {id:'chart-pie', dataId:'pie-data', type:'pie'},
    {id:'chart-meta8', dataId:'meta8-trend', type:'trend'},
    {id:'chart-metaplan', dataId:'metaplan-trend', type:'trend'},
    {id:'chart-kasaVarna', dataId:'chart-kasaVarna-data', type:'trend'},
    {id:'chart-kasaPavlikeni', dataId:'chart-kasaPavlikeni-data', type:'trend'},
  ];

  chartDefs.forEach(({id,dataId,type})=>{
    const canvas = document.getElementById(id);
    const dataEl = document.getElementById(dataId);
    if(!canvas||!dataEl) return;
    const data = JSON.parse(dataEl.textContent||'[]');
    if(type==='trend') createTrendChart(id, data, canvas);
    else if(type==='pie') createPieChart(id, data, canvas);
  });
}

function createTrendChart(id, data, canvas){
  const ctx = canvas.getContext('2d');
  S.charts[id] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:data.map(d=>d.label),
      datasets:[
        {label:'Приходи',data:data.map(d=>d.income),backgroundColor:'rgba(34,197,94,.7)',borderColor:'#22c55e',borderWidth:1,borderRadius:4},
        {label:'Разходи',data:data.map(d=>d.expenses),backgroundColor:'rgba(239,68,68,.7)',borderColor:'#ef4444',borderWidth:1,borderRadius:4},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#666',font:{size:11}}},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#ddd',bodyColor:'#888',borderColor:'#2a2a2a',borderWidth:1}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#555',font:{size:11}}},
        y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#555',font:{size:11},callback:v=>fmtShort(v)}}
      }
    }
  });
}

function createPieChart(id, data, canvas){
  const filtered = data.filter(d=>d.income>0);
  if(!filtered.length){
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('Няма данни за избрания период',canvas.width/2,canvas.height/2);
    return;
  }
  const ctx = canvas.getContext('2d');
  S.charts[id] = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:filtered.map(d=>d.label),
      datasets:[{data:filtered.map(d=>d.income),backgroundColor:filtered.map(d=>d.color),borderColor:'#111',borderWidth:2,hoverOffset:8}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'65%',
      plugins:{legend:{position:'right',labels:{color:'#666',font:{size:11},boxWidth:12,padding:12}},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#ddd',bodyColor:'#888',borderColor:'#2a2a2a',borderWidth:1,callbacks:{label:ctx=>`${ctx.label}: ${fmtShort(ctx.raw)} лв.`}}}
    }
  });
}

  S.modal = null;

function confirmUser(id){
  const u=db.users.find(u=>u.id===id);
  if(u){ u.confirmed=true; saveDB(); notify('Потребителят е потвърден','ok'); render(); }
}

function deleteUser(id){
  if(!confirm('Изтриване на потребителя?')) return;
  db.users=db.users.filter(u=>u.id!==id); saveDB(); notify('Потребителят е изтрит','ok'); render();
}

function deleteEntry(company, id){
  if(!confirm('Изтриване на записа?')) return;
  db[company].entries = db[company].entries.filter(e=>e.id!==id);
  saveDB(); notify('Записът е изтрит','ok'); render();
}

function deleteLSObject(id){
  if(!confirm('Изтриване на обекта и всички негови записи?')) return;
  db.liderStroy.objects = db.liderStroy.objects.filter(o=>o.id!==id);
  db.liderStroy.entries = db.liderStroy.entries.filter(e=>e.entityId!==id);
  if(S.selEntity===id){ S.selEntity=null; S.selSubEntity=null; }
  saveDB(); notify('Обектът е изтрит','ok'); render();

function deleteLSSubObj(objId, subId){
  if(!confirm('Изтриване на подобекта и всички негови записи?')) return;
  const obj=db.liderStroy.objects.find(o=>o.id===objId);
  if(obj) obj.subObjects=(obj.subObjects||[]).filter(s=>s.id!==subId);
  db.liderStroy.entries=db.liderStroy.entries.filter(e=>!(e.entityId===objId&&e.subEntityId===subId));
  if(S.selSubEntity===subId) S.selSubEntity=null;
  saveDB(); notify('Подобектът е изтрит','ok'); render();

function bindEvents(){
  document.getElementById('login-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const email=document.getElementById('l-email').value.trim();
    const pass=document.getElementById('l-pass').value;
    const r=login(email,pass);
    if(r.ok){ S.view='dashboard'; render(); }
    else notify(r.msg,'err');
  });

  document.getElementById('reg-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const name=document.getElementById('r-name').value.trim();
    const email=document.getElementById('r-email').value.trim();
    const pass=document.getElementById('r-pass').value;
    const pass2=document.getElementById('r-pass2').value;
    if(pass!==pass2){ notify('Паролите не съвпадат','err'); return; }
    const companies=getSelectedCompanies();
    if(companies.length===0){ notify('Изберете поне една фирма','err'); return; }
    const r=register(email,pass,name,companies);
    if(r.ok){ notify('Заявката е изпратена! Изчакайте потвърждение от администратор.','ok'); setTimeout(()=>{S.view='login';render();},2200); }
    else notify(r.msg,'err');
  });

  document.getElementById('forgot-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const email=document.getElementById('fp-email').value.trim();
    const result=handleForgotPassword(email);
    const div=document.getElementById('fp-result');
    if(!div) return;
    if(result.ok){
      div.innerHTML=`
        <div style="background:#0d0d0d;border:1px solid #22c55e44;border-radius:8px;padding:14px">
          <div style="font-size:12px;color:#22c55e;font-weight:700;margin-bottom:8px"><i class="fa fa-check-circle"></i> Линкът е генериран</div>

          <div style="background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 10px;font-size:11px;font-family:monospace;color:#aaa;word-break:break-all;margin-bottom:8px">${result.resetUrl}</div>
          <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${result.resetUrl}').then(()=>notify('Копирано!','ok'))"><i class="fa fa-copy"></i> Копирай линка</button>
        </div>`;
    } else {
      div.innerHTML=`<div style="color:#ef4444;font-size:13px;padding:10px"><i class="fa fa-times-circle"></i> ${result.msg}</div>`;
    }
  });

  document.getElementById('reset-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const token=e.target.dataset.token;
    const pass=document.getElementById('rp-pass').value;
    const pass2=document.getElementById('rp-pass2').value;
    if(pass!==pass2){ notify('Паролите не съвпадат','err'); return; }
    if(pass.length<6){ notify('Паролата трябва да е поне 6 символа','err'); return; }
    const result=doResetPassword(token,pass);
    if(result.ok){
      notify('Паролата е променена успешно!','ok');
      setTimeout(()=>{ window.location.href=window.location.pathname; },2000);
    } else {
      notify(result.msg,'err');
    }
  });

  document.getElementById('m-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    handleModalSubmit();
  });
}

// =================== FORGOT / RESET PASSWORD ===================
function handleForgotPassword(email){
  const u=db.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
  if(!u) return {ok:false, msg:'Имейлът не е намерен в системата'};
  if(!db.resetTokens) db.resetTokens=[];
  // Remove old tokens for this user
  db.resetTokens=db.resetTokens.filter(t=>t.userId!==u.id);
  const token=genId()+genId()+genId();
  const expiresAt=new Date(Date.now()+24*60*60*1000).toISOString();
  db.resetTokens.push({token,userId:u.id,expiresAt});
  saveDB();
  const resetUrl=window.location.href.split('?')[0]+'?reset='+token;
  return {ok:true, resetUrl, email:u.email};
}

function doResetPassword(token, newPass){
  if(!db.resetTokens) return {ok:false,msg:'Невалиден токен'};
  const rec=db.resetTokens.find(t=>t.token===token && new Date(t.expiresAt)>new Date());
  if(!rec) return {ok:false,msg:'Линкът е изтекъл или вече е използван'};
  const u=db.users.find(u=>u.id===rec.userId);
  if(!u) return {ok:false,msg:'Потребителят не е намерен'};
  u.password=newPass;
  db.resetTokens=db.resetTokens.filter(t=>t.token!==token);
  saveDB();
  return {ok:true};
}
